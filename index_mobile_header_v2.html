<!DOCTYPE html>

<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>חופשה משפחתית בחוות נועם | 1–3.10.2026</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f7f1e8;--paper:#fffaf3;--ink:#2c2a26;--muted:#766e64;--sand:#d9b48f;--brown:#6f4f37;--sage:#869173;--line:rgba(44,42,38,.12);--shadow:0 12px 34px rgba(67,48,31,.10);--r:24px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik","Segoe UI",sans-serif;line-height:1.55}button,input{font:inherit}a{color:inherit}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px max(14px,calc((100vw - 1120px)/2));background:#f7f1e8ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;white-space:nowrap}.menu{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}.menu::-webkit-scrollbar{display:none}.menu button,.langs button{border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:999px;font-weight:700;cursor:pointer;white-space:nowrap}.menu button.on,.langs button.on{background:var(--ink);color:#fff}.langs{display:flex;gap:4px;background:#fff;padding:4px;border-radius:999px;white-space:nowrap}
.page{display:none}.page.on{display:block}.wrap{max-width:1120px;margin:auto;padding:0 18px 78px}section{padding-top:64px}
.hero{min-height:76vh;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 75% 18%,#fff8 0 8%,transparent 26%),linear-gradient(160deg,#f0d5b5 0 43%,#d4a476 43% 63%,#896a4d 63% 74%,#4b4437 74%)}.hero:before,.hero:after{content:"";position:absolute;bottom:-17%;border-radius:50% 50% 0 0}.hero:before{width:85%;height:44%;left:-14%;background:#a87956;transform:rotate(5deg)}.hero:after{width:88%;height:36%;right:-20%;background:#705a43;transform:rotate(-5deg)}.heroIn{position:relative;z-index:2;max-width:850px;text-align:center;padding:70px 18px 105px}.eyebrow{display:inline-block;background:#fffaf3cf;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px}h1{font-size:clamp(40px,7.5vw,78px);line-height:1.02;letter-spacing:-.025em;margin:20px 0 14px;font-weight:800}.hero h2{font-size:clamp(20px,3vw,28px);margin:0 0 8px;font-weight:600}.hero p{font-size:clamp(17px,2.1vw,21px);margin:0 auto 22px}.count{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:26px 0}.cbox{min-width:88px;background:#fffaf3df;border:1px solid var(--line);border-radius:18px;padding:10px}.cbox b{display:block;font-size:27px}.cbox span{font-size:12px;color:var(--muted)}.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px}.pill{background:#fffaf3cb;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:700}
.head{display:flex;justify-content:space-between;gap:22px;align-items:end;margin-bottom:20px}.head h2{font-size:clamp(30px,5vw,50px);line-height:1.05;margin:0}.head p{max-width:540px;margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:21px;box-shadow:var(--shadow)}.card h3{font-size:22px;margin:0 0 7px}.card p{margin:0;color:var(--muted)}.third{grid-column:span 4}.half{grid-column:span 6}.full{grid-column:1/-1}.ico{font-size:31px;margin-bottom:8px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.tag{font-size:12px;font-weight:800;padding:6px 9px;border-radius:999px;background:#efe7dc}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 15px;font-weight:800;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff}.route{display:none;grid-template-columns:repeat(3,1fr);gap:14px}.route.on{display:grid}.stop{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}.stop strong{font-size:19px}.stop small{display:block;color:var(--muted);margin:6px 0 12px}.notice{padding:12px 14px;border-radius:14px;background:#f1e1c8;margin-top:12px;font-size:13px}.maplink{font-weight:800;text-decoration:none;border-bottom:1px solid currentColor}
details{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0 18px;box-shadow:var(--shadow)}details+details{margin-top:12px}summary{cursor:pointer;list-style:none;padding:18px 0;font-size:20px;font-weight:800}summary::-webkit-details-marker{display:none}.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding-bottom:18px}.check{display:flex;gap:10px;align-items:center;padding:11px 12px;background:#f6efe5;border-radius:14px;cursor:pointer}.check input{width:18px;height:18px;accent-color:var(--brown)}.check.done span{text-decoration:line-through;color:#999}.addrow{display:flex;gap:8px;padding-bottom:18px}.addrow input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fff}.btn{border:0;background:var(--ink);color:#fff;border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer}.dogtoggle{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#efe3d4;border-radius:18px;padding:14px 16px;margin:14px 0 12px}.switch{position:relative;width:50px;height:28px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#c6b8a7;border-radius:999px;cursor:pointer}.slider:before{content:"";position:absolute;width:22px;height:22px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--sage)}.switch input:checked+.slider:before{transform:translateX(22px)}.hidden{display:none!important}
.splitNote{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.noteCard{border-radius:20px;padding:18px;border:1px solid var(--line)}.privateNote{background:#f3e8d9}.cloudNote{background:#e8eee2}.noteCard strong{display:block;font-size:19px;margin-bottom:4px}.noteCard p{margin:0;color:var(--muted);font-size:14px}
.cloudStatus{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px 13px;border-radius:14px;background:#efe7dc;font-size:13px;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#b08968}.cloudStatus.live .dot{background:#4b8b52}.cloudStatus.error .dot{background:#b54f4f}
.sharedBox{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.sharedForm{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;margin-bottom:18px}.sharedForm input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px}.sharedRows{display:grid;gap:9px}.sharedRow{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px;background:#f7f0e6;border-radius:16px}.sharedRow input[type="checkbox"]{width:19px;height:19px;accent-color:var(--sage)}.sharedRow .itemText.done{text-decoration:line-through;color:#999}.owner{color:var(--muted);font-size:14px}.deleteBtn{border:0;background:#eadfd2;border-radius:11px;width:36px;height:36px;cursor:pointer}.empty{text-align:center;padding:35px 20px;border:2px dashed #d8c6b0;border-radius:20px;background:#fbf6ef}.empty .plus{font-size:38px}.empty p{margin:6px 0 0;color:var(--muted)}
.important{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mini{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}.mini b{display:block;font-size:21px;margin:3px 0}
footer{text-align:center;padding:50px 18px 70px;color:var(--muted)}
@media(max-width:940px){.top{flex-wrap:wrap}.brand{flex:1}.langs{margin-inline-start:auto}.menu{order:3;width:100%;justify-content:flex-start}.third,.half{grid-column:1/-1}.route{grid-template-columns:1fr}.important{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.head{display:block}.head p{margin-top:8px}.checklist{grid-template-columns:1fr}.splitNote{grid-template-columns:1fr}.sharedForm,.sharedRow{grid-template-columns:1fr}.sharedRow input[type="checkbox"]{justify-self:start}.deleteBtn{width:100%}.important{grid-template-columns:1fr}.brand{font-size:13px}.menu button{font-size:13px;padding:7px 9px}}

.gearTabs{display:flex;gap:8px;margin:0 0 20px;background:#eee4d7;padding:5px;border-radius:18px;width:max-content;max-width:100%}
.gearTabs button{border:0;background:transparent;color:var(--muted);padding:11px 17px;border-radius:14px;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}
.gearTabs button.on{background:var(--ink);color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.gearPane{display:none}.gearPane.on{display:block}
@media(max-width:520px){.gearTabs{width:100%}.gearTabs button{flex:1;padding:10px 8px;font-size:13px}}

.cloudStatus{
  display:inline-flex;align-items:center;gap:6px;
  margin:0 0 14px;padding:7px 10px;border-radius:999px;
  background:#edf3e8;color:#4d5f3d;font-size:13px;font-weight:700
}
.cloudRow{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) auto auto}
.cloudDone{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.cloudDone input{width:18px;height:18px;accent-color:var(--brown)}
@media(max-width:700px){
  .cloudRow{grid-template-columns:1fr}
  .cloudDone{padding:4px 2px}
}

.cloudRow input[type="text"], .cloudRow input:not([type]){
  width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:10px 11px;font:inherit;color:var(--ink)
}

/* Mobile top navigation: reliable horizontal scrolling in both Hebrew and Russian */
.menu{
  min-width:0;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  justify-content:flex-start !important;
  flex-wrap:nowrap !important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  scroll-behavior:smooth;
  scrollbar-width:none;
  direction:ltr; /* keeps horizontal scrolling predictable on mobile */
  padding-inline:2px;
}
.menu::-webkit-scrollbar{display:none}
.menu button{
  flex:0 0 auto;
  white-space:nowrap;
}
html[dir="rtl"] .menu button{direction:rtl}
html[dir="ltr"] .menu button{direction:ltr}

@media(max-width:920px){
  .top{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    width:100%;
    overflow:visible;
  }
  .menu{
    order:3;
    flex:0 0 100%;
    width:100%;
    max-width:100vw;
    padding:6px 2px 3px;
    margin:0;
  }
}

@media(max-width:520px){
  .top{
    padding-inline:10px;
  }
  .menu{
    gap:4px;
  }
  .menu button{
    padding:8px 10px;
    font-size:13px;
  }
}

/* Revised mobile header:
   Row 1 = brand + language
   Row 2+ = all navigation tabs visible, no horizontal scrolling */
@media(max-width:920px){
  .top{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:
      "brand langs"
      "menu menu";
    gap:10px 12px;
    align-items:center;
    padding:10px 12px 12px;
  }

  .brand{
    grid-area:brand;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .langs{
    grid-area:langs;
    justify-self:end;
    margin:0 !important;
  }

  .menu{
    grid-area:menu;
    width:100% !important;
    max-width:none !important;
    display:grid !important;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
    overflow:visible !important;
    padding:0 !important;
    margin:0 !important;
    direction:rtl !important;
  }

  .menu button{
    width:100%;
    min-width:0;
    padding:9px 7px;
    border-radius:12px;
    text-align:center;
    white-space:normal !important;
    line-height:1.15;
    font-size:13px;
  }

  html[dir="ltr"] .menu{
    direction:ltr !important;
  }
}

@media(max-width:560px){
  .top{
    grid-template-columns:minmax(0,1fr) auto;
    gap:9px 8px;
  }

  .brand{
    font-size:12px;
  }

  .langs button{
    padding:7px 9px;
    font-size:12px;
  }

  .menu{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:5px;
  }

  .menu button{
    min-height:38px;
    padding:8px 6px;
    font-size:12.5px;
  }
}
</style>
</head>
<body>
<header class="top">
<div class="brand" data-t="brand"></div>
<nav class="menu">
<button class="on" data-page="home" data-t="navHome"></button>
<button data-page="road" data-t="navRoad"></button>
<button data-page="ideas" data-t="navIdeas"></button>
<button data-page="equipment" data-t="navEquipment"></button><button data-page="important" data-t="navImportant"></button>
</nav>
<div class="langs"><button class="on" id="he">עברית</button><button id="ru">Русский</button></div>
</header>
<div class="page on" id="home">
<section class="hero">
<div class="heroIn">
<div class="eyebrow" data-t="eyebrow"></div>
<h1 data-t="heroTitle"></h1>
<h2 data-t="heroSub"></h2>
<p data-t="heroText"></p>
<div class="count" id="count">
<div class="cbox"><b id="d">–</b><span data-t="days"></span></div>
<div class="cbox"><b id="h">–</b><span data-t="hours"></span></div>
<div class="cbox"><b id="m">–</b><span data-t="mins"></span></div>
<div class="cbox"><b id="s">–</b><span data-t="secs"></span></div>
</div>
<div class="pills"><span class="pill">⛺ <span data-t="twoNights"></span></span><span class="pill">🐾 <span data-t="withDogs"></span></span><span class="pill">🏜️ <span data-t="ramon"></span></span></div>
</div>
</section>
<div class="wrap"><section>
<div class="head"><div><h2 data-t="ourTrip"></h2></div><p data-t="ourTripSub"></p></div>
<div class="grid">
<article class="card third"><div class="ico">⛺</div><h3 data-t="camp"></h3><p data-t="campText"></p></article>
<article class="card third"><div class="ico">🧊</div><h3 data-t="food"></h3><p data-t="foodText"></p></article>
<article class="card third"><div class="ico">🐾</div><h3 data-t="dogsFarm"></h3><p data-t="dogsFarmText"></p></article>
</div>
</section></div>
</div>
<div class="page" id="road"><div class="wrap"><section>
<div class="head"><div><h2 data-t="roadTitle"></h2></div><p data-t="roadSub"></p></div>
<div class="tabs"><button class="on" data-route="out" data-t="outbound"></button><button data-route="back" data-t="returnTrip"></button></div>
<div class="route on" id="out">
<article class="stop"><strong data-t="forestName"></strong><small data-t="forestDesc"></small><div class="tags"><span class="tag">🐾</span><span class="tag" data-t="free"></span><span class="tag" data-t="shortStop"></span></div><div class="notice" data-t="forestNotice"></div><p><a class="maplink" data-t="navigate" href="https://www.google.com/maps/search/?api=1&amp;query=%D7%99%D7%A2%D7%A8+%D7%94%D7%9E%D7%9C%D7%90%D7%9B%D7%99%D7%9D+%D7%A9%D7%97%D7%A8%D7%99%D7%94" target="_blank"></a></p></article>
<article class="stop"><strong data-t="coffeeStop"></strong><small data-t="coffeeDesc"></small><div class="tags"><span class="tag">☕</span><span class="tag">🚻</span><span class="tag">🐾</span></div></article>
<article class="stop"><strong data-t="arrival"></strong><small data-t="arrivalDesc"></small><p><a class="maplink" data-t="navigate" href="https://www.google.com/maps/search/?api=1&amp;query=%D7%97%D7%95%D7%95%D7%AA+%D7%A0%D7%95%D7%A2%D7%9D+%D7%91%D7%9E%D7%93%D7%91%D7%A8" target="_blank"></a></p></article>
</div>
<div class="route" id="back">
<article class="stop"><strong data-t="avdat"></strong><small data-t="avdatDesc"></small><div class="tags"><span class="tag" data-t="dogsAllowed"></span><span class="tag" data-t="leashMuzzle"></span></div><p><a class="maplink" data-t="navigate" href="https://www.google.com/maps/search/?api=1&amp;query=%D7%92%D7%9F+%D7%9C%D7%90%D7%95%D7%9E%D7%99+%D7%A2%D7%91%D7%93%D7%AA" target="_blank"></a></p></article>
<article class="stop"><strong data-t="coffeeBack"></strong><small data-t="coffeeBackDesc"></small><div class="tags"><span class="tag">☕</span><span class="tag">🚻</span><span class="tag">🐾</span></div></article>
<article class="stop"><strong data-t="home"></strong><small data-t="homeDesc"></small></article>
</div>
</section></div></div>
<div class="page" id="ideas"><div class="wrap"><section>
<div class="head"><div><h2 data-t="ideasTitle"></h2></div><p data-t="ideasSub"></p></div>
<div class="grid">
<article class="card half"><div class="ico">🌈</div><h3 data-t="colors"></h3><p data-t="colorsText"></p><div class="tags"><span class="tag" data-t="dogsAllowed"></span><span class="tag" data-t="leashMuzzle"></span><span class="tag">🚗</span></div></article>
<article class="card half"><div class="ico">🏛️</div><h3 data-t="avdat"></h3><p data-t="avdatCardText"></p><div class="tags"><span class="tag" data-t="dogsAllowed"></span><span class="tag" data-t="leashMuzzle"></span></div></article>
<article class="card full"><div class="ico">🍷</div><h3 data-t="farmDay"></h3><p data-t="farmDayText"></p></article>
</div>
</section></div></div>
<div class="page" id="equipment"><div class="wrap"><section><div class="head"><div><h2 data-t="equipmentTitle"></h2></div><p data-t="equipmentSub"></p></div><div class="gearTabs"><button class="on" data-gear="gearPersonal" data-t="gearPersonalTab" type="button"></button><button data-gear="gearShared" data-t="gearSharedTab" type="button"></button></div><div class="gearPane on" id="gearPersonal">
<div class="splitNote">
<div class="noteCard privateNote"><strong data-t="privateLabel"></strong><p data-t="privateExplain"></p></div>
<div class="noteCard cloudNote"><strong data-t="sharedLabel"></strong><p data-t="sharedExplain"></p></div>
</div>
<details open=""><summary data-t="personalGear"></summary><div class="checklist" id="personalList"></div><div class="addrow"><input data-ph="customPh" id="custom"/><button class="btn" data-t="add" id="addCustom"></button></div></details>
<div class="dogtoggle"><div><strong data-t="dogQuestion"></strong><div data-t="dogOnly" style="font-size:13px;color:var(--muted)"></div></div><label class="switch"><input id="dogToggle" type="checkbox"/><span class="slider"></span></label></div>
<details class="hidden" id="dogBox"><summary data-t="dogGear"></summary><div class="checklist" id="dogList"></div></details>
</div><div class="gearPane" id="gearShared">
<div class="cloudStatus" id="cloudStatus"><span class="dot"></span><span data-t="cloudWaiting" id="cloudStatusText"></span></div>
<div class="sharedBox">
<div class="sharedForm"><input data-ph="itemPh" id="sharedItem"/><input data-ph="ownerPh" id="sharedOwner"/><button class="btn" data-t="addShared" id="addShared"></button></div>
<div class="sharedRows" id="sharedRows"></div>
<div class="empty" id="sharedEmpty"><div class="plus">＋</div><strong data-t="sharedEmpty"></strong><p data-t="sharedEmptySub"></p></div>
</div>
</div></section></div></div>
<div class="page" id="important"><div class="wrap"><section>
<div class="head"><div><h2 data-t="importantTitle"></h2></div></div>
<div class="important">
<div class="mini"><span>🕒</span><b>15:00</b><span data-t="checkin"></span></div>
<div class="mini"><span>🕚</span><b>11:00</b><span data-t="checkout"></span></div>
<div class="mini"><span>🧊</span><b data-t="noFridge"></b><span data-t="coolers"></span></div>
<div class="mini"><span>🔇</span><b data-t="quiet"></b><span data-t="quietText"></span></div>
</div>
</section></div></div>
<footer><h2 data-t="footerTitle"></h2><div data-t="footerDate"></div></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, updateDoc,
  onSnapshot, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCargliCGzqWzdYmSzaakgx9UJhV6wNbTM",
  authDomain: "familytrip2026-acc04.firebaseapp.com",
  projectId: "familytrip2026-acc04",
  storageBucket: "familytrip2026-acc04.firebasestorage.app",
  messagingSenderId: "1051577627824",
  appId: "1:1051577627824:web:fe0d422d86dd4cb15ab775",
  measurementId: "G-SDRBZ8GPM5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const sharedCol = collection(db, "trips", "noam-2026", "sharedItems");

const statusBox = document.getElementById("cloudStatus");
const statusText = document.getElementById("cloudStatusText");
const sharedItem = document.getElementById("sharedItem");
const sharedOwner = document.getElementById("sharedOwner");
const addShared = document.getElementById("addShared");
const rows = document.getElementById("sharedRows");
const empty = document.getElementById("sharedEmpty");

let ready = false;
let latestDocs = [];

function lang() {
  return localStorage.getItem("tripLang") || "he";
}

function status(kind) {
  const texts = {
    waiting: {he:"מתחבר לענן…", ru:"Подключение к облаку…"},
    live: {he:"מסונכרן לענן בזמן אמת ✓", ru:"Синхронизация с облаком ✓"},
    error: {he:"שגיאה בחיבור לענן", ru:"Ошибка подключения к облаку"}
  };
  if (statusText) statusText.textContent = texts[kind][lang()];
  if (statusBox) {
    statusBox.classList.remove("live","error");
    if (kind === "live") statusBox.classList.add("live");
    if (kind === "error") statusBox.classList.add("error");
  }
}

function labels() {
  return lang() === "ru"
    ? {item:"Что нужно привезти?", owner:"Кто привозит?", done:"Готово", remove:"Удалить"}
    : {item:"מה צריך להביא?", owner:"מי מביא?", done:"בוצע", remove:"מחיקה"};
}

function renderShared() {
  if (!rows || !empty) return;
  rows.innerHTML = "";
  empty.classList.toggle("hidden", latestDocs.length > 0);
  const l = labels();

  latestDocs.forEach(row => {
    const wrap = document.createElement("div");
    wrap.className = "sharedRow cloudRow";

    const done = document.createElement("input");
    done.type = "checkbox";
    done.checked = !!row.done;
    done.addEventListener("change", async () => {
      await updateDoc(doc(db, "trips", "noam-2026", "sharedItems", row.id), {done: done.checked});
    });

    const itemInput = document.createElement("input");
    itemInput.value = row.item || "";
    itemInput.placeholder = l.item;
    itemInput.addEventListener("change", async () => {
      await updateDoc(doc(db, "trips", "noam-2026", "sharedItems", row.id), {item: itemInput.value.trim()});
    });

    const ownerInput = document.createElement("input");
    ownerInput.value = row.owner || "";
    ownerInput.placeholder = l.owner;
    ownerInput.addEventListener("change", async () => {
      await updateDoc(doc(db, "trips", "noam-2026", "sharedItems", row.id), {owner: ownerInput.value.trim()});
    });

    const del = document.createElement("button");
    del.type = "button";
    del.className = "deleteBtn";
    del.textContent = "×";
    del.title = l.remove;
    del.addEventListener("click", async () => {
      await deleteDoc(doc(db, "trips", "noam-2026", "sharedItems", row.id));
    });

    wrap.append(done, itemInput, ownerInput, del);
    rows.append(wrap);
  });
}

async function addSharedItem() {
  if (!ready) {
    status("waiting");
    return;
  }
  const item = (sharedItem?.value || "").trim();
  const owner = (sharedOwner?.value || "").trim();
  if (!item) {
    sharedItem?.focus();
    return;
  }
  try {
    await addDoc(sharedCol, {
      item,
      owner,
      done:false,
      createdAt:serverTimestamp()
    });
    if (sharedItem) sharedItem.value = "";
    if (sharedOwner) sharedOwner.value = "";
    sharedItem?.focus();
  } catch (err) {
    console.error("Add shared item failed:", err);
    status("error");
  }
}

if (addShared) {
  addShared.addEventListener("click", addSharedItem);
}
if (sharedOwner) {
  sharedOwner.addEventListener("keydown", e => {
    if (e.key === "Enter") addSharedItem();
  });
}
if (sharedItem) {
  sharedItem.addEventListener("keydown", e => {
    if (e.key === "Enter") addSharedItem();
  });
}

window.addEventListener("trip-language", () => {
  status(ready ? "live" : "waiting");
  renderShared();
});

status("waiting");

try {
  await signInAnonymously(auth);

  onAuthStateChanged(auth, user => {
    if (!user) return;
    ready = true;
    status("live");

    const q = query(sharedCol, orderBy("createdAt", "asc"));
    onSnapshot(q, snap => {
      latestDocs = snap.docs.map(d => ({id:d.id, ...d.data()}));
      renderShared();
      status("live");
    }, err => {
      console.error("Firestore listener failed:", err);
      status("error");
    });
  });
} catch (err) {
  console.error("Firebase auth failed:", err);
  status("error");
}
</script></body>
</html>
